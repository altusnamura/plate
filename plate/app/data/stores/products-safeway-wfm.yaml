# Safeway and Whole Foods product mappings.
#
# Same caveat as the Trader Joe's file, only stronger: Safeway prices move with
# weekly promotions and vary between stores in the same city, and Whole Foods
# runs different shelf and Prime prices. Nothing here is live. Treat these as a
# starting point and fix them as you shop.
#
# Coverage here is deliberately narrower than the TJ's file. It exists so the
# planner has a real second and third option — better prices on some items, and a
# fallback for the things TJ's doesn't reliably carry (rotisserie chicken, bulk
# grains, protein powder, pine nuts). The trip-consolidation logic then has
# something to work with rather than sending you to three stores for one item
# each.
