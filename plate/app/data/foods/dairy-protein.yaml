---
# Dairy, eggs, meat and seafood.
#
# Meat and fish are raw weights. Cheeses marked `vegetarian: false` use animal
# rennet as a rule — parmigiano reggiano is the classic case — and the planner's
# vegetarian-lunch rule respects that, because a "vegetarian" lunch built on
# parmesan isn't one. Substitute a microbially-set hard cheese if you want those
# recipes to count.
