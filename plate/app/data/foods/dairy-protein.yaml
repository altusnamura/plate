    keeps_days: 28
    tags: [complete_protein, b12_source, choline]
    per_100g: {kcal: 143, protein_g: 12.6, fat_g: 9.5, satfat_g: 3.1, carb_g: 0.7, fiber_g: 0.0, sugar_g: 0.4, sodium_mg: 142, potassium_mg: 138}

