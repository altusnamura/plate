# Nuts, seeds, oils and nut butters.
#
# These are calorie-dense enough that gram accuracy matters more here than
# anywhere else in the database: being 20 g out on olive oil is 180 kcal, which is
# most of a day's deficit. Recipes specify oils by tablespoon because that is how
# people cook, and the tablespoon weights below are real (13.5 g for oil, not the
# 15 g you get by assuming water density).
foods:
  - id: olive-oil
    name: Extra virgin olive oil
    aisle: oils_vinegar
    vegan: true
    dash_group: fats_oils
    dash_serving_g: 4.5
    g_per_ml: 0.91
    unit_g: {tbsp: 13.5, tsp: 4.5, cup: 216, bottle: 500}
    keeps_days: 540
    pantry_staple: true
    tags: [monounsaturated, dash_bonus]
    per_100g: {kcal: 884, protein_g: 0.0, fat_g: 100.0, satfat_g: 13.8, carb_g: 0.0, fiber_g: 0.0, sugar_g: 0.0, sodium_mg: 2, potassium_mg: 1}

