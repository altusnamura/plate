# Grains and legumes.
#
# IMPORTANT BASIS NOTE: grains, dried lentils and dried beans are recorded DRY,
# because that is how you weigh them into a pot. 100 g of dry brown rice is
# ~370 kcal and becomes roughly 260 g cooked. Recipes here therefore specify dry
# weights — if you swap in a recipe measured in cooked cups, convert it or the
# calorie maths will be off by a factor of nearly three.
#
# Canned beans are recorded DRAINED, which is how they land in the pan. Sodium
# figures assume the ordinary salted version; rinsing under the tap removes
# roughly 40% of it, which the recipes assume you do.
