---
# Condiments, canned goods, broths, spices, sweeteners and baking staples.
#
# Most of these are `pantry_staple: true`, which keeps them off shopping lists —
# the assumption being you own cumin and don't need reminding weekly. Mark the
# ones you actually run out of as out-of-stock in the app and they reappear.
#
# A few records carry `atwater_exempt`: their label energy legitimately disagrees
# with the 4/4/9 macro reconstruction (cocoa's unavailable carbohydrate, baking
# powder's mineral salts, the ethanol in vanilla extract), so the startup
# consistency check skips them instead of crying wolf.
foods:
