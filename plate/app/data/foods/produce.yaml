---
# Fresh produce and frozen fruit/vegetables.
#
# Nutrition is per 100 g of the food AS THE RECIPE USES IT — raw weight for
# vegetables, since that is how you weigh them when cooking. Values are
# reference figures for the ordinary supermarket version; they are close enough
# for planning but they are not laboratory analyses of the specific bunch of kale
# you bought. Run the USDA importer (Settings -> Data) to replace them with
# FoodData Central values, or just correct any you care about.
#
# dash_serving_g is the gram weight of one DASH serving on the same raw basis:
# 1 cup raw leafy greens (~30 g), 1/2 cup other vegetables (~80 g), one medium
# fruit (~120 g).
foods:
