# Run PLATE standalone in Docker — on a NAS, a home server, or anywhere you'd
# rather it stayed up without a laptop being open.
#
#   docker compose up -d          then open http://<host>:8099
#
# Both mounted folders are plain files. `data` holds the database (your weights,
# blood pressure, food logs and plans); `config` holds any recipe or price YAML
# you write. Back up by copying them.
services:
  plate:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: plate
    ports:
      - "8099:8099"
    volumes:
      - ./data:/data
      - ./config:/config
    environment:
      # Day boundaries matter — a weight logged at 23:50 belongs to that day, not
      # the next one in UTC. Set this to your zone.
      TZ: America/Los_Angeles
      # Uncomment to connect a Home Assistant. Create the token on your HA
      # profile page under "Long-lived access tokens".
      # HA_URL: http://homeassistant.local:8123
      # HA_TOKEN: your_long_lived_access_token
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8099/healthz', timeout=5).status==200 else 1)"]
      interval: 60s
      timeout: 10s
      start_period: 40s
      retries: 3
